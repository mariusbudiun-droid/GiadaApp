<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D5C4"/>
      <stop offset="55%" stop-color="#D4A584"/>
      <stop offset="100%" stop-color="#B85C42"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FBF7F2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FBF7F2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" ry="232" fill="url(#glow)"/>

  <!-- Silhouette di profilo materno che diventa G:
       - chignon/testa in alto
       - profilo del viso/collo che scende
       - schiena che curva
       - pancione (grande curva tonda in avanti) = bowl della G
       - chiusura sotto il pancione
       Lettura: di profilo è una mamma con pancione, da lontano legge come una G italica -->

  <g transform="translate(512 512)" fill="#FBF7F2">

    <!-- chignon/testa piccola in alto -->
    <circle cx="-30" cy="-280" r="55"/>

    <!-- corpo principale a G/silhouette -->
    <path d="
      M -85 -245
      Q -110 -180 -100 -110
      Q -80 -50 -30 0
      Q 60 60 130 130
      Q 200 210 175 290
      Q 140 360 50 360
      Q -90 360 -180 280
      Q -250 200 -260 80
      Q -270 -50 -230 -160
      Q -190 -250 -110 -270
      Z" />

    <!-- crossbar/spunto orizzontale che chiude la G dall'interno -->
    <rect x="40" y="120" width="180" height="48" rx="24"/>

    <!-- segno sottile di vita: piccolo cuore dentro il pancione -->
    <path d="
      M -10 175
      C -10 158, -28 148, -38 162
      C -48 148, -66 158, -66 175
      C -66 196, -38 218, -38 218
      C -38 218, -10 196, -10 175 Z"
      fill="#B85C42" opacity="0.7"/>
  </g>
</svg>
