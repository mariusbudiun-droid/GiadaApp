<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kin">
  <title>Kin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">

<body>

<div class="app">

  <!-- HOME -->
  <section class="section active" id="sec-home">
    <div id="homeContent"></div>
  </section>

  <!-- TRACKING -->
  <section class="section" id="sec-tracking">
    <div id="trackingContent"></div>
  </section>

  <!-- SALUTE -->
  <section class="section" id="sec-salute">
    <div id="healthContent"></div>
  </section>

  <!-- DIARIO -->
  <section class="section" id="sec-diario">
    <div id="diaryContent"></div>
  </section>

  <!-- ALTRO -->
  <section class="section" id="sec-altro">
    <div id="settingsContent"></div>
  </section>

</div>

<!-- ============== TAB BAR ============== -->
<nav class="tabbar">
  <button class="tab active" data-tab="home" onclick="goTo('home')" aria-label="Home">
    <svg class="tab-svg" viewBox="0 0 24 24"><path d="M12 3l9 8h-2v9h-5v-6h-4v6H5v-9H3z"/></svg>
    <span class="tab-label">Home</span>
  </button>
  <button class="tab" data-tab="tracking" onclick="goTo('tracking')" aria-label="Tracking">
    <svg class="tab-svg" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="3" rx="1"/><rect x="3" y="11" width="14" height="3" rx="1"/><rect x="3" y="16" width="10" height="3" rx="1"/></svg>
    <span class="tab-label">Tracking</span>
  </button>
  <button class="tab" data-tab="salute" onclick="goTo('salute')" aria-label="Salute">
    <svg class="tab-svg" viewBox="0 0 24 24"><path d="M12 21s-6.7-4.3-9.3-8.2C1 10 1.5 6.5 4.4 5 6.6 3.8 9 4.6 12 7.5c3-2.9 5.4-3.7 7.6-2.5 2.9 1.5 3.4 5 1.7 7.8C18.7 16.7 12 21 12 21z" opacity="0.15"/><path d="M4 12h3l2-4 3 8 2-5h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="tab-label">Salute</span>
  </button>
  <button class="tab" data-tab="diario" onclick="goTo('diario')" aria-label="Diario">
    <svg class="tab-svg" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v15.5a.5.5 0 0 1-.78.42L15 18.93l-2.78 1.83a.5.5 0 0 1-.55 0L8.78 18.93l-2.78 1.83a.5.5 0 0 1-.78-.42V5c0-1.1.9-2 2-2z"/></svg>
    <span class="tab-label">Diario</span>
  </button>
  <button class="tab" data-tab="altro" onclick="goTo('altro')" aria-label="Altro">
    <svg class="tab-svg" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
    <span class="tab-label">Altro</span>
  </button>
</nav>

<!-- ============== BOTTOM SHEET (event form / edit) ============== -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-drag"></div>
  <div class="sheet-header">
    <div class="sheet-header-text">
      <div class="sheet-title" id="sheetTitle">—</div>
      <div class="sheet-sub" id="sheetSub"></div>
    </div>
    <button class="sheet-close" onclick="closeSheet()" aria-label="Chiudi">×</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
